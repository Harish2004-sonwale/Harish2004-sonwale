<svg viewBox="0 0 1080 670" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="System Initialization Code">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040910"/>
      <stop offset="100%" stop-color="#071627"/>
    </linearGradient>
    
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .txt { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 14.5px; fill: #94A3B8; }
      .comment { fill: #7C93A8; font-style: italic; }
      .keyword { fill: #22D3EE; }
      .variable { fill: #BAE6FD; }
      .string { fill: #5EEAD4; }
      .bracket { fill: #38BDF8; }
      .key { fill: #7DD3FC; }
      .fade-in { animation: fadeIn 0.5s ease-in forwards; opacity: 0; }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .line { animation-delay: calc(var(--i) * 0.05s); }
    </style>
  </defs>

  <rect width="1078" height="668" x="1" y="1" rx="16" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Window controls -->
  <circle cx="30" cy="30" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="50" cy="30" r="6" fill="#eab308" opacity="0.8"/>
  <circle cx="70" cy="30" r="6" fill="#22c55e" opacity="0.8"/>
  <text x="540" y="34" class="txt" fill="#7C93A8" text-anchor="middle">Glacier.OS Neural Interface</text>
  
  <line x1="0" y1="55" x2="1080" y2="55" stroke="#22D3EE" stroke-opacity="0.1"/>

  <!-- Code content -->
  <g class="txt" transform="translate(32, 90)">
    
    <text y="10" class="fade-in line" style="--i:1"><tspan class="keyword">const</tspan> <tspan class="variable">DevOpsEngineer</tspan> = <tspan class="bracket">{</tspan></text>
    
    <text y="38" class="fade-in line" style="--i:2">    <tspan class="key">identity</tspan>: <tspan class="bracket">{</tspan></text>
    <text y="66" class="fade-in line" style="--i:3">        <tspan class="key">name</tspan>:     <tspan class="string">"Harish Sonwale"</tspan>,</text>
    <text y="94" class="fade-in line" style="--i:4">        <tspan class="key">role</tspan>:     <tspan class="string">"DevOps Engineer | Cloud Architect | AI Automation Specialist"</tspan>,</text>
    <text y="122" class="fade-in line" style="--i:5">        <tspan class="key">location</tspan>: <tspan class="string">"Pune, Maharashtra, India 🇮🇳"</tspan>,</text>
    <text y="150" class="fade-in line" style="--i:6">        <tspan class="key">email</tspan>:    <tspan class="string">"harishsonwale4@gmail.com"</tspan>,</text>
    <text y="178" class="fade-in line" style="--i:7">        <tspan class="key">phone</tspan>:    <tspan class="string">"+91 9975996411"</tspan>,</text>
    <text y="206" class="fade-in line" style="--i:8">    <tspan class="bracket">}</tspan>,</text>

    <text y="244" class="fade-in line" style="--i:9">    <tspan class="key">education</tspan>: <tspan class="bracket">{</tspan></text>
    <text y="272" class="fade-in line" style="--i:10">        <tspan class="key">degree</tspan>:       <tspan class="string">"B.Tech in Computer Science &amp; Engineering (IoT, Cyber Security &amp; Blockchain Technology)"</tspan>,</text>
    <text y="300" class="fade-in line" style="--i:11">        <tspan class="key">university</tspan>:   <tspan class="string">"MGM University"</tspan>,</text>
    <text y="328" class="fade-in line" style="--i:12">        <tspan class="key">cgpa</tspan>:         <tspan class="string">"7.45 / 10"</tspan>,</text>
    <text y="356" class="fade-in line" style="--i:13">    <tspan class="bracket">}</tspan>,</text>

    <text y="394" class="fade-in line" style="--i:14">    <tspan class="key">currentMission</tspan>: <tspan class="bracket">[</tspan></text>
    <text y="422" class="fade-in line" style="--i:15">        <tspan class="string">"🏭 FactoryAI — AI-powered industrial automation, monitoring &amp; intelligent decision-making"</tspan>,</text>
    <text y="450" class="fade-in line" style="--i:16">        <tspan class="string">"🧠 DevLens AI — AI-based code analysis, developer assistance &amp; intelligent insights"</tspan>,</text>
    <text y="478" class="fade-in line" style="--i:17">        <tspan class="string">"🏥 MediGen AI — AI-powered healthcare assistance, medical information &amp; intelligent recommendations"</tspan></text>
    <text y="506" class="fade-in line" style="--i:18">    <tspan class="bracket">]</tspan></text>
    
    <text y="536" class="fade-in line" style="--i:19"><tspan class="bracket">};</tspan></text>
  </g>
</svg>
